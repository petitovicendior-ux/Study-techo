<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | StudyTech</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

    <style>

        /* =========================================
           STUDYTECH — LOGIN
        ========================================= */

        .login-page {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(168, 85, 247, 0.18),
                    transparent 35%
                ),
                #07060b;
            color: #f7f5fa;
            font-family: "Inter", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
        }

        .login-card {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.045),
                    rgba(168, 85, 247, 0.025)
                );

            border: 1px solid rgba(168, 85, 247, 0.22);

            border-radius: 24px;

            padding: 42px;

            box-shadow:
                0 0 60px rgba(168, 85, 247, 0.08),
                0 25px 80px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(18px);
        }

        .login-card::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            top: -120px;
            right: -100px;

            background: #a855f7;

            opacity: 0.12;

            filter: blur(70px);

            border-radius: 50%;

            pointer-events: none;
        }

        .login-card::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            bottom: -100px;
            left: -90px;

            background: #7c3aed;

            opacity: 0.10;

            filter: blur(70px);

            border-radius: 50%;

            pointer-events: none;
        }


        /* =========================================
           LOGO
        ========================================= */

        .login-logo {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            gap: 13px;

            text-decoration: none;

            color: #fff;

            width: fit-content;

            margin-bottom: 55px;
        }

        .login-logo .logo-mark {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #a855f7,
                    #7c3aed
                );

            color: #fff;

            font-size: 17px;
            font-weight: 900;

            box-shadow:
                0 0 25px rgba(168, 85, 247, 0.35);
        }

        .login-logo strong {
            display: block;

            font-size: 21px;
            font-weight: 800;

            letter-spacing: -0.5px;
        }

        .login-logo span {
            display: block;

            margin-top: 2px;

            color: #a855f7;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 2px;
        }


        /* =========================================
           CONTENIDO
        ========================================= */

        .login-content {
            position: relative;
            z-index: 2;

            text-align: center;
        }

        .login-content .section-label {
            display: inline-block;

            margin-bottom: 16px;

            color: #c084fc;

            font-family: "JetBrains Mono", monospace;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 3px;
        }

        .login-content h1 {
            margin: 0;

            color: #fff;

            font-size: clamp(30px, 6vw, 42px);

            line-height: 1.08;

            letter-spacing: -1.5px;
        }

        .login-content > p {
            max-width: 380px;

            margin: 18px auto 32px;

            color: #aaa2b4;

            font-size: 15px;

            line-height: 1.7;
        }


        /* =========================================
           BOTÓN GOOGLE
        ========================================= */

        .google-button {
            width: 100%;

            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            padding: 14px 20px;

            border: 1px solid rgba(255, 255, 255, 0.10);

            border-radius: 14px;

            background: #ffffff;

            color: #17151b;

            font-family: "Inter", sans-serif;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .google-button:hover {
            transform: translateY(-2px);

            background: #f7f7f7;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .google-button:active {
            transform: translateY(0);
        }

        .google-icon {
            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #4285f4;

            background: #f1f3f4;

            font-size: 17px;
            font-weight: 800;
        }


        /* =========================================
           TÉRMINOS
        ========================================= */

        .login-terms {
            margin-top: 20px !important;
            margin-bottom: 0 !important;

            color: #716978 !important;

            font-size: 11px !important;

            line-height: 1.6 !important;
        }


        /* =========================================
           VOLVER
        ========================================= */

        .back-link {
            position: relative;
            z-index: 2;

            display: block;

            margin-top: 30px;

            text-align: center;

            color: #8f8797;

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            transition:
                color 0.2s ease;
        }

        .back-link:hover {
            color: #c084fc;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 600px) {

            .login-page {
                padding: 20px 14px;
            }

            .login-card {
                padding: 30px 22px;

                border-radius: 20px;
            }

            .login-logo {
                margin-bottom: 42px;
            }

            .login-content h1 {
                font-size: 31px;
            }

            .login-content > p {
                font-size: 14px;
            }

            .google-button {
                min-height: 56px;
            }
        }

    </style>

</head>


<body class="login-page">

    <main class="login-container">

        <div class="login-card">


            <!-- LOGO -->

            <a
                href="index.html"
                class="login-logo"
            >

                <div class="logo-mark">
                    ST
                </div>

                <div>

                    <strong>
                        StudyTech
                    </strong>

                    <span>
                        D.W.J.D
                    </span>

                </div>

            </a>


            <!-- CONTENIDO -->

            <div class="login-content">

                <span class="section-label">
                    STUDYTECH
                </span>

                <h1>
                    Comienza tu aprendizaje
                </h1>

                <p>
                    Inicia sesión para guardar tu progreso,
                    completar retos y avanzar en tus rutas
                    de aprendizaje.
                </p>


                <!-- GOOGLE -->

                <button
                    id="googleLogin"
                    class="google-button"
                    type="button"
                >

                    <span class="google-icon">
                        G
                    </span>

                    <span>
                        Continuar con Google
                    </span>

                </button>


                <p class="login-terms">
                    Al continuar podrás acceder a tu cuenta
                    de StudyTech y guardar tu progreso.
                </p>

            </div>


            <!-- VOLVER -->

            <a
                href="index.html"
                class="back-link"
            >
                ← Volver a StudyTech
            </a>

        </div>

    </main>


    <!-- FIREBASE / LOGIN -->

    <script
        type="module"
        src="js/login.js"
    ></script>

</body>

</html>
